name: razorpay_turbo_standard
description: Flutter plugin for Razorpay SDK. To know more about Razorpay, visit http://razorpay.com.
version: 1.0.1
homepage: https://github.com/razorpay/razorpay-flutter

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=2.5.0" # Consider bumping Flutter version if needed

dependencies:
  flutter:
    sdk: flutter
  eventify: ^1.0.0
  fluttertoast: ^8.0.7
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.16.5

flutter:
  plugin:
    platforms:
      android:
        package: com.razorpay.razorpay_turbo_standard
        pluginClass: RazorpayFlutterPlugin
      ios:
        pluginClass: RazorpayFlutterPlugin
